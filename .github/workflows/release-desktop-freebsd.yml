# Package the FreeBSD Desktop application (pkg) from an upstream release tag.
#
# Every run downloads the upstream source archive for one released `dsh-vX.Y.Z-rc.N` tag and
# copies this fork's desktop support over it, listed in .github/linux-overlay/manifest.json. The
# source is never merged and never synchronized by hand: a newer upstream tag is simply a newer
# archive to overlay. `alpha` and `beta` builds are never selected.
#
# GitHub's hosted runners offer no FreeBSD, so the build runs inside a FreeBSD virtual machine
# (vmactions/freebsd-vm boots it on the Ubuntu runner) that executes
# .github/linux-overlay/build-freebsd.sh. That script installs the FreeBSD Electron distribution
# from the port's binary package, assembles the application through electron-builder's Linux
# path, and forms the pkg(8) package.
#
# The daily schedule selects the newest rc tag and stops immediately when a release for it
# already carries a FreeBSD package, so an unchanged upstream costs one short resolution job.
name: Release (FreeBSD Desktop)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to package, for example dsh-v0.2.0-rc.2. Empty selects the newest rc tag.'
        required: false
        type: string
      force:
        description: 'Rebuild and replace the release even when this tag was already packaged.'
        required: false
        type: boolean
        default: false
  schedule:
    # Daily, off the hour and after the Linux workflow, whose release the two share.
    - cron: '23 4 * * *'
  push:
    # Iteration trigger for the packaging branch; removed before this workflow lands on master.
    branches: [freebsd-packaging]

permissions:
  contents: write

concurrency:
  # A scheduled run must never displace a hand-started one, so runs are never cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'
  UPSTREAM_REPOSITORY: deepseek-ai/deepseek-harness
  # The FreeBSD Electron distribution the application is assembled with. The FreeBSD ports tree
  # publishes Electron binary packages through tagattie's FreeBSD-Electron releases; the port's
  # data directory has the Linux layout, which is what lets electron-builder assemble it.
  FREEBSD_ELECTRON_VERSION: '44.3.0'
  FREEBSD_ELECTRON_URL: https://github.com/tagattie/FreeBSD-Electron/releases/download/v44.3.0/electron44-44.3.0-freebsd15-amd64.pkg
  FREEBSD_ELECTRON_SHA256: d63c664a726d84e217a4f0c0700eff1ac457bd64b4bae3b218e75507bbe7537c

jobs:
  resolve:
    name: Resolve upstream tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      version: ${{ steps.select.outputs.version }}
      build: ${{ steps.select.outputs.build }}
    steps:
      # Full history: the manifest coverage check compares against the upstream revision the
      # manifest records, and a shallow clone would not contain it.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Select the newest upstream rc tag
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED}" ]; then
            tag="${REQUESTED}"
          else
            # Newest released rc tag by version order; alpha and beta builds are excluded.
            tag=$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPOSITORY}.git" \
              | awk -F/ '{print $NF}' \
              | grep -E '^dsh-v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' \
              | sort -V | tail -1)
          fi
          if [ -z "${tag}" ]; then
            echo "No released rc tag was found upstream." >&2
            exit 1
          fi
          if ! printf '%s' "${tag}" | grep -qE '^dsh-v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "Refusing ${tag}: name a released rc tag such as dsh-v0.2.0-rc.2." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#dsh-v}" >> "$GITHUB_OUTPUT"

          # The published FreeBSD asset is the record of what has been packaged, so a daily run
          # against an unchanged upstream stops here instead of rebuilding it. The Linux workflow
          # shares this release, so the check names the FreeBSD package rather than the release.
          if [ "${FORCE}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Selected ${tag}; rebuilding because force was requested."
          elif gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -q -- '-freebsd-x64\.pkg$'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Selected ${tag}; already carries a FreeBSD package, so no build is needed."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Selected ${tag}; not packaged for FreeBSD yet."
          fi

      # Every file this fork changes must be listed or excluded, or the build receives an
      # upstream tree missing part of the desktop support and fails minutes into packaging.
      - name: Verify the overlay covers every change
        if: steps.select.outputs.build == 'true'
        run: node .github/linux-overlay/verify-manifest.mjs "$GITHUB_WORKSPACE"

      # Applying the overlay to the selected tag catches a stale manifest before the build:
      # a file upstream renamed or removed cannot be replaced, and that is cheaper to learn here.
      - name: Verify the overlay applies to the selected tag
        if: steps.select.outputs.build == 'true'
        env:
          TAG: ${{ steps.select.outputs.tag }}
        run: |
          set -euo pipefail
          upstream="$RUNNER_TEMP/upstream-check"
          git init --quiet "$upstream"
          git -C "$upstream" fetch --quiet --depth 1 \
            "https://github.com/${UPSTREAM_REPOSITORY}.git" "refs/tags/${TAG}"
          git -C "$upstream" checkout --quiet FETCH_HEAD
          node "$GITHUB_WORKSPACE/.github/linux-overlay/apply.mjs" \
            --source "$GITHUB_WORKSPACE" --target "$upstream"
          echo "The overlay applies cleanly to ${TAG}."

  package:
    name: Package FreeBSD pkg
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true

      # The build happens inside the FreeBSD virtual machine this step boots; its output
      # directory is synchronized back into the workspace, and later steps run on the runner.
      - name: Package FreeBSD pkg
        uses: vmactions/freebsd-vm@v1
        env:
          DSH_TAG: ${{ needs.resolve.outputs.tag }}
          DSH_VERSION: ${{ needs.resolve.outputs.version }}
          DSH_UPSTREAM: ${{ env.UPSTREAM_REPOSITORY }}
          DSH_ELECTRON_URL: ${{ env.FREEBSD_ELECTRON_URL }}
          DSH_ELECTRON_SHA256: ${{ env.FREEBSD_ELECTRON_SHA256 }}
          DSH_ELECTRON_VERSION: ${{ env.FREEBSD_ELECTRON_VERSION }}
        with:
          release: '15.1'
          arch: x86_64
          mem: 8192
          cpu: 4
          envs: 'DSH_TAG DSH_VERSION DSH_UPSTREAM DSH_ELECTRON_URL DSH_ELECTRON_SHA256 DSH_ELECTRON_VERSION'
          run: |
            set -eu
            sh "$GITHUB_WORKSPACE/.github/linux-overlay/build-freebsd.sh"

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-freebsd-x64
          path: freebsd-artifacts/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish release
    needs: [resolve, package]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      # The release notes generator lives in this repository, not in the packaged artifacts.
      # This checkout also puts the repository's own `packages/` directory in the workspace, so
      # the downloaded assets go somewhere else: any other name avoids a collision, and a
      # collision would make the upload glob offer the repository's directories as assets.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          clean: true

      - uses: actions/download-artifact@v8
        with:
          name: deepseek-harness-freebsd-x64
          path: release-assets

      - name: Require the FreeBSD package
        run: |
          set -euo pipefail
          ls -la release-assets
          if [ -z "$(find release-assets -maxdepth 1 -type f -name '*-freebsd-x64.pkg' | head -1)" ]; then
            echo "Missing a package ending in -freebsd-x64.pkg; the FreeBSD build must produce one." >&2
            exit 1
          fi
          # The upload glob must offer files only. A directory here means the download path
          # overlapped something else in the workspace, and the upload would fail on it.
          if [ -n "$(find release-assets -mindepth 1 -maxdepth 1 -type d -print -quit)" ]; then
            echo 'Unexpected directory among the release assets:' >&2
            find release-assets -mindepth 1 -maxdepth 1 -type d >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          UPSTREAM: ${{ env.UPSTREAM_REPOSITORY }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          node "$GITHUB_WORKSPACE/.github/linux-overlay/release-notes.mjs" \
            "${TAG}" "${VERSION}" "${UPSTREAM}" "${GITHUB_REPOSITORY}" > "$notes"
          title="DeepSeek Harness ${VERSION}"
          # A rebuild replaces the assets in place. Deleting the release first would leave
          # nothing published if the replacement then failed, which is a worse outcome than a
          # release that briefly carries the previous build.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber release-assets/*
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "$title" --notes-file "$notes"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "$title" --notes-file "$notes" release-assets/*
          fi
          echo "Published ${TAG}."
